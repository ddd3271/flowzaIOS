name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Display version (e.g. 1.0.0)"
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      PROJECT: FlowzaCombined/FlowzaMobile/FlowzaMobile.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.0
        run: |
          echo "Installierte Xcode-Versionen:"
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26.0*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install matching iOS runtime
        run: |
          sudo xcodebuild -downloadPlatform iOS -buildVersion 26.0 || sudo xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes
          echo "actool: $(xcrun -f actool)"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI iOS workload
        run: |
          dotnet workload install maui-ios
          dotnet workload list

      - name: Build (unsigned)
        run: |
          dotnet build "$PROJECT" -f net10.0-ios -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ValidateXcodeVersion=false \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ApplicationDisplayVersion=${{ inputs.version }}

      - name: Package .ipa
        run: |
          APP=$(find "$(dirname "$PROJECT")/bin/Release" -name "*.app" -type d | head -1)
          echo "Found app bundle: $APP"
          rm -rf Payload Flowza-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Flowza-unsigned.ipa Payload
          ls -lh Flowza-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Flowza-unsigned-ipa
          path: Flowza-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ inputs.version }}-${{ github.run_number }}
          name: Flowza iOS ${{ inputs.version }}
          files: Flowza-unsigned.ipa
